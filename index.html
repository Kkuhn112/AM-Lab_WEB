<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lynx AM Lab · CU Denver</title>
  <meta name="description" content="Lynx Additive Manufacturing Lab, CU Denver Mechanical Engineering — printers, hours, and print requests.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">

    <main class="info" id="info">
      <header class="masthead">
        <img class="logo" id="labLogo" alt="Lynx AM Lab, Department of Mechanical Engineering">
        <div class="clock">
          <div class="clock-time" id="clockTime"></div>
          <div class="clock-date" id="clockDate"></div>
        </div>
      </header>

      <section class="top-row">
        <section class="hours" aria-labelledby="hoursHeading">
          <div class="row-head">
            <h2 id="hoursHeading">Hours</h2>
            <p class="status" id="status"></p>
          </div>
          <div class="timetable" id="timetable"></div>
          <p class="closures" id="closures"></p>
        </section>

        <section class="request" aria-labelledby="qrHeading">
          <a class="qr" id="qrLink" target="_blank" rel="noopener" aria-label="Open the print request form">
            <div id="qrBox"></div>
          </a>
          <h2 id="qrHeading"></h2>
          <p class="request-blurb" id="qrBlurb"></p>
          <a class="request-url" id="qrUrl" target="_blank" rel="noopener"></a>
        </section>
      </section>

      <section class="printers" aria-labelledby="printersHeading">
        <h2 id="printersHeading">Printers</h2>
        <div class="printer-grid" id="printerGrid"></div>
      </section>

      <footer class="foot">
        <p id="labMeta"></p>
        <img class="uni-logo" id="uniLogo" alt="University of Colorado Denver">
      </footer>
    </main>

    <aside class="stage" id="stage" aria-label="Featured animations">
      <div class="slides" id="slides"></div>
      <div class="stage-caption" id="stageCaption">
        <h2 class="stage-title" id="stageTitle"></h2>
        <p class="stage-text" id="stageText"></p>
      </div>
      <div class="stage-progress" aria-hidden="true"><span id="stageProgress"></span></div>
    </aside>
  </div>

  <!-- Classic scripts so the page works from file:// on a Pi -->
  <script src="js/config.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="vendor/model-viewer-umd.min.js"></script>
  <script src="js/exploded-demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
